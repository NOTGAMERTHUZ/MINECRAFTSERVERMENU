name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build plugin
        run: gradle build --no-daemon

      - name: Verify plugin JAR
        run: |
          ls -lh build/libs/
          jar tf build/libs/ThuzMenu-1.0.0.jar > jar-contents.txt
          grep -Fx 'plugin.yml' jar-contents.txt
          grep -Fx 'io/github/notgamerthuz/thuzmenu/ThuzMenu.class' jar-contents.txt

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ThuzMenu
          path: build/libs/ThuzMenu-1.0.0.jar
          if-no-files-found: error
